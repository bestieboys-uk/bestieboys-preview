name: Bump approved mockups
on:
  push:
    branches:
      - fix/mockup-display-mobile
    paths:
      - '.github/workflows/bump-approved-mockups.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh approved mockup assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='theme-lab.js?v=renderedboard1'
          new='theme-lab.js?v=approved2'
          if old not in s and new not in s:
              raise SystemExit('theme-lab version marker not found')
          s=s.replace(old,new)
          p.write_text(s)
          Path('.github/workflows/bump-approved-mockups.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Force approved mockups to load on preview"
          git push
