name: Validate direct mockups
on:
  push:
    branches:
      - fix/direct-mockup-assets
    paths:
      - '.github/workflows/validate-direct-mockups.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all approved WebP files
        run: |
          set -euo pipefail
          files=(
            assets/concepts/grindcore-blast-portrait.webp
            assets/concepts/grindcore-noise-wall.webp
            assets/concepts/grindcore-one-second-legend.webp
            assets/concepts/goregrind-canine-pathology.webp
            assets/concepts/goregrind-dissection-club.webp
            assets/concepts/goregrind-terminal-good-boy.webp
            assets/concepts/crust-no-masters-only-gerrard.webp
            assets/concepts/powerviolence-gerrard-no-peace.webp
            assets/concepts/gore-noise-signal-rot-gerrard.webp
            assets/concepts/death-doom-eternal-weight.webp
          )
          for f in "${files[@]}"; do
            test -s "$f"
            file "$f" | tee /dev/stderr | grep -q 'Web/P image'
          done
