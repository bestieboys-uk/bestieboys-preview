name: Wire concept artwork slots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-artwork-slots.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add artwork slots to all 21 concepts
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          if '.art-slot{' not in text:
              css = r'''
.art-slot{margin:14px 0 2px;border:1px solid var(--line);background:#070707;min-height:180px;position:relative;overflow:hidden}.concept-art{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#050505}.art-placeholder{min-height:180px;display:grid;place-items:center;align-content:center;text-align:center;padding:24px;color:#777}.art-placeholder span{color:var(--acid);font-size:.56rem;letter-spacing:.14em;font-weight:900}.art-placeholder strong{font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase;color:#cfc8bd;font-size:1.35rem;margin-top:8px}.art-placeholder small{font-size:.58rem;letter-spacing:.06em;margin-top:8px;max-width:38ch;word-break:break-word}.art-placeholder[hidden]{display:none}
'''
              text = text.replace('</style>', css + '</style>', 1)

          slots = {
              'Frostbite Portrait':'black-metal-frostbite-portrait',
              'Ritual Hound':'black-metal-ritual-hound',
              'Northern Apparition':'black-metal-northern-apparition',
              'Blast Portrait':'grindcore-blast-portrait',
              'Noise Wall':'grindcore-noise-wall',
              'One Second Legend':'grindcore-one-second-legend',
              'Canine Pathology':'goregrind-canine-pathology',
              'Dissection Club':'goregrind-dissection-club',
              'Terminal Good Boy':'goregrind-terminal-good-boy',
              'No Masters / Only Gerrard':'crust-no-masters-only-gerrard',
              'Total Canine Collapse':'crust-total-canine-collapse',
              'System Failure: Gerrard':'crust-system-failure-gerrard',
              'Gerrard // No Peace':'powerviolence-gerrard-no-peace',
              'Ten Second Icon':'powerviolence-ten-second-icon',
              'Gerrard vs. Everything':'powerviolence-gerrard-vs-everything',
              'Signal Rot: Gerrard':'gore-noise-signal-rot-gerrard',
              'Gurgle Transmission':'gore-noise-gurgle-transmission',
              'Unlistenable Good Boy':'gore-noise-unlistenable-good-boy',
              'Eternal Weight':'death-doom-eternal-weight',
              'The Good Boy Never Dies':'death-doom-good-boy-never-dies',
              'Crypt Hound':'death-doom-crypt-hound',
          }

          for title, slug in slots.items():
              marker = f'data-art-base="assets/concepts/{slug}"'
              if marker in text:
                  continue
              pattern = rf'(<h4>{re.escape(title)}</h4>.*?<div class="concept-body">)'
              slot = (
                  f'<div class="art-slot" data-art-base="assets/concepts/{slug}">'
                  f'<img class="concept-art" alt="{title} Gerrard concept artwork" hidden>'
                  f'<div class="art-placeholder"><span>ARTWORK SLOT</span><strong>{title}</strong>'
                  f'<small>{slug}.webp / .png / .jpg / .jpeg</small></div></div>'
              )
              text, count = re.subn(pattern, rf'\1{slot}', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not wire artwork slot for {title}')

          if 'function loadConceptArt' not in text:
              script = r'''
<script>
function loadConceptArt(concept){
  const slot=concept.querySelector('[data-art-base]');
  if(!slot || slot.dataset.loaded==='done') return;
  slot.dataset.loaded='done';
  const img=slot.querySelector('.concept-art');
  const placeholder=slot.querySelector('.art-placeholder');
  const exts=['.webp','.png','.jpg','.jpeg'];
  let i=0;
  function next(){
    if(i>=exts.length){img.hidden=true;placeholder.hidden=false;return;}
    img.onload=()=>{img.hidden=false;placeholder.hidden=true;};
    img.onerror=()=>{i+=1;next();};
    img.src=slot.dataset.artBase+exts[i];
  }
  next();
}
document.querySelectorAll('details.concept').forEach(concept=>{
  concept.addEventListener('toggle',()=>{if(concept.open) loadConceptArt(concept);});
  if(concept.open) loadConceptArt(concept);
});
</script>
'''
              text = text.replace('</body>', script + '</body>', 1)

          path.write_text(text)
      - name: Commit artwork-slot wiring
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire 21 upload-ready artwork slots"
          git push
