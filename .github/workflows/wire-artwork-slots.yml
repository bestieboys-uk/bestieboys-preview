name: Wire concept artwork slots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wire-artwork-slots.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run artwork slot wiring
        run: python .github/scripts/wire_artwork_slots.py
      - name: Commit artwork slots
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire 21 upload-ready artwork slots"
          git push
