name: Bump garment art study
on:
  push:
    branches: [main]
    paths: [.github/workflows/bump-garment-art-study.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset versions and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('theme-lab.js')
          s=p.read_text()
          s=s.replace("archive-target.js?v=3", "archive-target.js?v=4")
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('theme-lab.js?v=4', 'theme-lab.js?v=5')
          p.write_text(s)
          Path('.github/workflows/bump-garment-art-study.yml').unlink()
          PY
      - name: Commit garment art study
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load Black Metal artwork garment studies"
          git push
