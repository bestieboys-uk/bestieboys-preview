name: Bump garment preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/bump-garment-v2.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump theme script cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('src="theme-lab.js?v=3"','src="theme-lab.js?v=4"')
          p.write_text(s)
          PY
      - name: Commit cache key
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load premium garment mockup v2"
          git push
