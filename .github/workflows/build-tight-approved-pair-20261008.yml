name: Build tighter crop of approved BEFORE AFTER asset
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-tight-approved-pair-20261008.yml
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and crop only top/bottom whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages pillow
          src=assets/site/bestieboys-before-after-approved-20261008.png
          dst=assets/site/bestieboys-before-after-approved-tight-20261008.png
          echo 'abd9e9654b84d1ce6a625a2277c00719d1ce9c364f547d668c7023bdccc64cf1  '$src | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          src='assets/site/bestieboys-before-after-approved-20261008.png'
          dst='assets/site/bestieboys-before-after-approved-tight-20261008.png'
          im=Image.open(src).convert('RGB')
          assert im.size==(1448,1086), im.size
          # Remove only unused black texture above and below the approved composition.
          out=im.crop((0,100,1448,1015))
          assert out.size==(1448,915), out.size
          out.save(dst,optimize=True)
          print('TIGHT_APPROVED_PAIR',out.size)
          PY
      - name: Commit derived crop only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name bestieboys-capture-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site/bestieboys-before-after-approved-tight-20261008.png
          if git diff --cached --quiet; then
            echo ALREADY_CURRENT
          else
            git commit -m 'assets: tighten approved BEFORE AFTER vertical whitespace'
            git push origin HEAD:main
          fi
