name: Bump garment logo study
on:
  push:
    paths:
      - '.github/workflows/bump-garment-logo-study.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump garment asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('garment-storefront-v3.css?v=1','garment-storefront-v3.css?v=2')
          s=s.replace('garment-storefront-v3.js?v=1','garment-storefront-v3.js?v=2')
          p.write_text(s)
          Path('.github/workflows/bump-garment-logo-study.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load Bestie Boys logo-only garment studies"
          git push
