name: Install high-resolution concept assets
on:
  push:
    branches:
      - fix/high-res-concept-assets
    paths:
      - '.github/workflows/install-highres-concepts.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and validate concept boards
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf highres-concepts-q10.tgz
          files=(
            assets/concepts/black-metal-frostbite-portrait.webp
            assets/concepts/black-metal-northern-apparition.webp
            assets/concepts/black-metal-ritual-hound.webp
            assets/concepts/grindcore-blast-portrait.webp
            assets/concepts/grindcore-noise-wall.webp
            assets/concepts/grindcore-one-second-legend.webp
            assets/concepts/goregrind-canine-pathology.webp
            assets/concepts/goregrind-dissection-club.webp
            assets/concepts/goregrind-terminal-good-boy.webp
            assets/concepts/crust-no-masters-only-gerrard.webp
            assets/concepts/gore-noise-signal-rot-gerrard.webp
            assets/concepts/death-doom-eternal-weight.webp
          )
          for f in "${files[@]}"; do
            test -s "$f"
            bytes=$(stat -c%s "$f")
            test "$bytes" -gt 10000
            info=$(file "$f")
            echo "$info"
            echo "$info" | grep -q 'Web/P image'
            echo "$info" | grep -Eq '[0-9]+x[0-9]+'
          done
          # Cache-bust the direct concept renderer so mobile Safari requests the replaced files.
          sed -i 's/\.webp?v=direct1/\.webp?v=hires1/g' approved-mockups.js
          sed -i "s/approved-mockups.js?v=direct1/approved-mockups.js?v=hires1/g" theme-lab.js
          rm -f highres-concepts-q10.tgz
          rm -f .github/workflows/install-highres-concepts.yml
      - name: Commit verified high-resolution assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace preview derivatives with high-resolution concept boards"
          git push
