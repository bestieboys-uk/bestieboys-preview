name: Activate format library
on:
  push:
    branches:
      - fix/format-library-mobile
    paths:
      - '.github/workflows/bump-format-library.yml'
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace obsolete garment board loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('theme-lab.js?v=direct1','theme-lab.js?v=format1')
          s=s.replace('theme-lab.js?v=grind1','theme-lab.js?v=format1')
          s=s.replace('garment-storefront-v3.js?v=2','garment-storefront-v4.js?v=1')
          s=s.replace('garment-storefront-v3.js?v=rendered1','garment-storefront-v4.js?v=1')
          p.write_text(s)
          Path('.github/workflows/bump-format-library.yml').unlink()
          PY
      - name: Commit format library activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate mobile format library"
          git push
