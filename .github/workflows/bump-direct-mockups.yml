name: Bump direct mockups
on:
  push:
    branches:
      - fix/direct-mockup-assets
    paths:
      - '.github/workflows/bump-direct-mockups.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load direct mockup renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='theme-lab.js?v=grind1'
          new='theme-lab.js?v=direct1'
          if old not in s:
              raise SystemExit('expected theme-lab cache marker missing')
          p.write_text(s.replace(old,new))
          Path('.github/workflows/bump-direct-mockups.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load verified direct mockup assets"
          git push
