name: Assemble direct mockup assets
on:
  push:
    branches:
      - fix/direct-mockup-assets
    paths:
      - '.github/workflows/assemble-direct-mockups.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode direct WebP assets
        shell: bash
        run: |
          set -euo pipefail
          stems=(
            goregrind-canine-pathology
            goregrind-dissection-club
            goregrind-terminal-good-boy
            crust-no-masters-only-gerrard
            powerviolence-gerrard-no-peace
            gore-noise-signal-rot-gerrard
            death-doom-eternal-weight
            grindcore-one-second-legend
          )
          for stem in "${stems[@]}"; do
            cat assets/mockup-payload/${stem}.webp.part* | base64 -d > assets/concepts/${stem}.webp
            file assets/concepts/${stem}.webp
            file assets/concepts/${stem}.webp | grep -q 'Web/P image'
          done
          base64 -d assets/concepts/grindcore-blast-portrait.b64 > assets/concepts/grindcore-blast-portrait.webp
          base64 -d assets/concepts/grindcore-noise-wall.b64 > assets/concepts/grindcore-noise-wall.webp
          file assets/concepts/grindcore-blast-portrait.webp | grep -q 'Web/P image'
          file assets/concepts/grindcore-noise-wall.webp | grep -q 'Web/P image'
      - name: Clean temporary payloads
        run: |
          rm -rf assets/mockup-payload
          rm -f assets/concepts/grindcore-blast-portrait.b64 assets/concepts/grindcore-noise-wall.b64 assets/concepts/grindcore-one-second-legend.b64
          rm -f assets/concepts/approved-genre-mockups-sprite.webp
          rm -f .github/workflows/validate-mockup-assets.yml
          rm -f .github/workflows/assemble-direct-mockups.yml
      - name: Commit verified direct mockup images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace broken mockup payloads with direct WebP assets"
          git push
