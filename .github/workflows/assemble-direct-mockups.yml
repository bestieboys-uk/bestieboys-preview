name: Diagnose direct mockup assets
on:
  push:
    branches:
      - fix/direct-mockup-assets
    paths:
      - '.github/workflows/assemble-direct-mockups.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every payload independently
        shell: bash
        run: |
          stems=(
            goregrind-canine-pathology
            goregrind-dissection-club
            goregrind-terminal-good-boy
            crust-no-masters-only-gerrard
            powerviolence-gerrard-no-peace
            gore-noise-signal-rot-gerrard
            death-doom-eternal-weight
            grindcore-one-second-legend
          )
          bad=0
          for stem in "${stems[@]}"; do
            echo "=== $stem ==="
            if cat assets/mockup-payload/${stem}.webp.part* | base64 -d > /tmp/${stem}.webp 2>/tmp/${stem}.err; then
              file /tmp/${stem}.webp
              if ! file /tmp/${stem}.webp | grep -q 'Web/P image'; then bad=1; fi
            else
              echo "BASE64_INVALID"
              cat /tmp/${stem}.err
              bad=1
            fi
          done
          for stem in grindcore-blast-portrait grindcore-noise-wall; do
            echo "=== $stem legacy ==="
            if base64 -d assets/concepts/${stem}.b64 > /tmp/${stem}.webp; then file /tmp/${stem}.webp; else echo BASE64_INVALID; bad=1; fi
          done
          exit $bad
