name: Apply Design Lab v5 fix
on:
  push:
    paths:
      - '.github/workflows/apply-design-lab-v5-fix.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/apply_design_lab_v5.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Design Lab with four reference website styles"
          git push
