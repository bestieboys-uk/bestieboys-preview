name: PR5 Hosted CTA QA

on:
  push:
    branches: [main]
    paths:
      - 'qa-pr5-20260828/**'
      - '.github/workflows/pr5-hosted-qa.yml'
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Test hosted Create your Bestie CTA
        env:
          QA_URL: https://bestieboys-uk.github.io/bestieboys-preview/qa-pr5-20260828/tour-issue.html
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const url = process.env.QA_URL;

          async function waitForPublish() {
            for (let i = 0; i < 30; i++) {
              try {
                const r = await fetch(url, { cache: 'no-store' });
                const text = await r.text();
                if (r.ok && text.includes('Create your Bestie') && text.includes("Tally.openPopup('pbY28J'")) return;
              } catch (_) {}
              await new Promise(r => setTimeout(r, 10000));
            }
            throw new Error('GitHub Pages preview did not publish within 5 minutes');
          }

          (async () => {
            await waitForPublish();
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', err => errors.push('pageerror: ' + String(err)));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });

            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForFunction(() => window.Tally && typeof window.Tally.openPopup === 'function', null, { timeout: 30000 });

            const instrumented = await page.evaluate(() => {
              const original = window.Tally.openPopup;
              if (typeof original !== 'function') return false;
              window.__bestieQaPopupCall = null;
              window.Tally.openPopup = function (id, options) {
                let safeOptions = null;
                try { safeOptions = JSON.parse(JSON.stringify(options || {})); } catch (_) { safeOptions = options || {}; }
                window.__bestieQaPopupCall = { id, options: safeOptions };
                return original.apply(this, arguments);
              };
              return window.Tally.openPopup !== original;
            });
            console.log('INSTRUMENTED=' + instrumented);

            const cta = page.locator('#create-bestie');
            await cta.waitFor({ state: 'visible', timeout: 30000 });
            await cta.click();

            await page.waitForFunction(() => window.__bestieQaPopupCall !== null, null, { timeout: 10000 });
            const call = await page.evaluate(() => window.__bestieQaPopupCall);
            console.log('HOSTED_URL=' + url);
            console.log('POPUP_CALL=' + JSON.stringify(call));

            if (!call || call.id !== 'pbY28J') throw new Error('CTA did not call Tally.openPopup with form pbY28J');
            if (!call.options || !call.options.hiddenFields) throw new Error('CTA popup call did not include hiddenFields');
            if (call.options.hiddenFields.origin !== 'bestieboys-tour-issue') throw new Error('origin hidden field was wrong');
            if (call.options.hiddenFields.build_version !== 'BB-CYB-PHASE-B-01') throw new Error('build_version hidden field was wrong');

            await page.waitForTimeout(3000);

            const iframeInfo = await page.locator('iframe').evaluateAll(nodes => nodes.map((n, i) => ({
              i,
              src: n.getAttribute('src') || '',
              title: n.getAttribute('title') || '',
              className: n.className || ''
            })));
            const tallyNodes = await page.locator('[class*="tally"], [id*="tally"], iframe[src*="tally.so"]').count();
            const tallyPopupCount = await page.locator('.tally-popup').count();
            console.log('IFRAMES=' + JSON.stringify(iframeInfo));
            console.log('PLAYWRIGHT_FRAMES=' + JSON.stringify(page.frames().map(f => f.url())));
            console.log('TALLY_RELATED_NODE_COUNT=' + tallyNodes);
            console.log('TALLY_POPUP_COUNT=' + tallyPopupCount);

            let passwordInputVisible = false;
            let passwordTextPresent = false;
            let tallyFrameFound = false;
            const iframeHandles = await page.locator('iframe').elementHandles();
            for (const handle of iframeHandles) {
              const src = await handle.getAttribute('src').catch(() => '');
              if (!(src || '').includes('tally.so')) continue;
              const frame = await handle.contentFrame();
              if (!frame) continue;
              tallyFrameFound = true;
              await frame.waitForLoadState('domcontentloaded', { timeout: 30000 }).catch(() => {});
              const passwordInput = frame.locator('input[type="password"]');
              if (await passwordInput.count()) {
                passwordInputVisible = await passwordInput.first().isVisible().catch(() => false);
              }
              const frameText = (await frame.locator('body').innerText().catch(() => '')).toLowerCase();
              if (frameText.includes('password')) passwordTextPresent = true;
            }

            console.log('TALLY_FRAME_FOUND=' + tallyFrameFound);
            console.log('PASSWORD_INPUT_VISIBLE=' + passwordInputVisible);
            console.log('PASSWORD_TEXT_PRESENT=' + passwordTextPresent);
            if (errors.length) console.log('BROWSER_ERRORS=' + JSON.stringify(errors));

            await page.screenshot({ path: 'pr5-hosted-cta.png', fullPage: true });

            const popupRendered = tallyPopupCount > 0 || iframeInfo.some(x => x.src.includes('tally.so')) || tallyNodes > 0;
            if (!popupRendered) throw new Error('The CTA called Tally.openPopup correctly, but no Tally popup UI rendered');

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5-hosted-cta-qa
          path: pr5-hosted-cta.png
          if-no-files-found: ignore
