name: Validate mockup assets
on:
  push:
    branches:
      - fix/direct-mockup-assets
    paths:
      - '.github/workflows/validate-mockup-assets.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect committed assets
        run: |
          set -eux
          file assets/concepts/approved-genre-mockups-sprite.webp
          wc -c assets/concepts/approved-genre-mockups-sprite.webp
          for f in assets/concepts/grindcore-*.b64; do
            echo "$f"
            wc -c "$f"
            base64 -d "$f" > "/tmp/$(basename "$f" .b64).webp"
            file "/tmp/$(basename "$f" .b64).webp"
          done
      - name: Validate images with Pillow
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths=[Path('assets/concepts/approved-genre-mockups-sprite.webp'), *Path('/tmp').glob('grindcore-*.webp')]
          for p in paths:
              try:
                  im=Image.open(p)
                  im.verify()
                  im=Image.open(p)
                  print(p, im.size, im.mode)
              except Exception as e:
                  print(p, 'INVALID', repr(e))
                  raise
          PY
