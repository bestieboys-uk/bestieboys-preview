name: Install existing Black Metal mockups

on:
  push:
    branches: [preview/black-metal-live-v1]
    paths: [.github/workflows/install-existing-black-metal.yml]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode existing Black Metal boards and update preview
        shell: python
        run: |
          from pathlib import Path
          import base64, re

          assets = {
              'bm1': ('assets/concepts/black-metal-frostbite-portrait.webp', 65340, 'Frostbite Portrait'),
              'bm2': ('assets/concepts/black-metal-ritual-hound.webp', 60316, 'Ritual Hound'),
              'bm3': ('assets/concepts/black-metal-northern-apparition.webp', 72404, 'Northern Apparition'),
          }
          for key, (dest, expected, title) in assets.items():
              parts = sorted(Path('.tmp').glob(f'{key}.part*'), key=lambda p: int(p.name.split('part')[1]))
              joined = ''.join(p.read_text().strip() for p in parts)
              raw = base64.b64decode(joined, validate=True)
              if len(raw) != expected:
                  raise SystemExit(f'{key}: expected {expected} bytes, got {len(raw)}')
              out = Path(dest)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(raw)

          p = Path('index.html')
          html = p.read_text()
          html = html.replace('<div class="badge">GERRARD / DEVELOPMENT 001 / TOUR ISSUE</div>', '')

          for key, (src, expected, title) in assets.items():
              pattern = rf'(<details class="concept"><summary><div class="concept-top"><span class="concept-code">.*?</span><span class="status">)ARTWORK PENDING(</span></div><h4>{re.escape(title)}</h4>)'
              html, count = re.subn(pattern, r'\1EARLY VISUAL MOCKUP\2', html, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update status for {title}')

              if f'alt="{title} early visual mockup"' not in html:
                  thumb_pattern = rf'(<h4>{re.escape(title)}</h4><div class="quick">.*?</div>)(</summary>)'
                  thumb = f'<img class="bm-early-thumb" src="{src}" alt="{title} early visual mockup" loading="lazy">'
                  html, count = re.subn(thumb_pattern, rf'\1{thumb}\2', html, count=1, flags=re.S)
                  if count != 1:
                      raise SystemExit(f'Could not add preview board for {title}')

          html = html.replace('theme-lab.css?v=3','theme-lab.css?v=5')
          html = html.replace('theme-lab.css?v=4','theme-lab.css?v=5')
          p.write_text(html)

          css = Path('theme-lab.css')
          text = css.read_text()
          marker = '/* Existing Black Metal early-board previews */'
          if marker not in text:
              text += '''\n\n/* Existing Black Metal early-board previews */\n.bm-early-thumb{display:block;width:100%;height:auto;aspect-ratio:5/4;object-fit:cover;margin:16px 0 2px;border:1px solid var(--lab-line);background:#0b0b0b}\n.genre.blackmetal .concept-body .art-slot{display:none!important}\nbody[data-theme="archive"] .bm-early-thumb{box-shadow:0 14px 32px rgba(63,47,32,.10)}\n@media(max-width:620px){.bm-early-thumb{margin-top:14px}}\n'''
              css.write_text(text)
      - name: Commit installed boards
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html theme-lab.css assets/concepts/black-metal-*.webp
          git commit -m "Reuse early Black Metal boards and remove hero badge"
          git push
