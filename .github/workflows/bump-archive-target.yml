name: Bump Archive target
on:
  push:
    branches: [main]
    paths: [.github/workflows/bump-archive-target.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump preview script and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('theme-lab.js?v=4','theme-lab.js?v=5')
          p.write_text(s)
          PY
          rm .github/workflows/bump-archive-target.yml
      - name: Commit target pass
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load Archive visual target pass"
          git push
