name: cPanel Migration QA

on:
  push:
    branches: [cpanel-migration-20260925]
    paths:
      - 'cpanel-migration/**'
      - '.github/workflows/cpanel-migration-qa.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: PHP syntax
        run: php -l cpanel-migration/api/custom-enquiries.php
      - name: Migration assertions
        shell: bash
        run: |
          grep -Fq 'translate: none !important;' cpanel-migration/mobile-enquiry-fix.css
          grep -Fq 'RewriteRule ^api/custom-enquiries/?$ api/custom-enquiries.php' cpanel-migration/.htaccess
          grep -Fq '/data/bestieboys/bestieboys-private' cpanel-migration/.htaccess
