name: Install recovered Goregrind review boards
on:
  push:
    branches:
      - fix/highres-review-assets-20260827
    paths:
      - '.github/workflows/assemble-recovered-goregrind.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and validate Canine Pathology AVIF
        shell: bash
        run: |
          set -euo pipefail
          cat assets/hires-payload/goregrind-canine-pathology.avif.part* | base64 -d > assets/concepts/goregrind-canine-pathology.avif
          bytes=$(stat -c%s assets/concepts/goregrind-canine-pathology.avif)
          test "$bytes" -gt 10000
          info=$(file assets/concepts/goregrind-canine-pathology.avif)
          echo "CANINE :: $bytes bytes :: $info"
          echo "$info" | grep -q 'AVIF Image'
      - name: Recover and validate Dissection Club WebP repair
        shell: bash
        run: |
          set -euo pipefail
          git show origin/asset-quality-batch:assets/concepts/goregrind-dissection-club.webp > assets/concepts/goregrind-dissection-club.webp
          bytes=$(stat -c%s assets/concepts/goregrind-dissection-club.webp)
          test "$bytes" -gt 14000
          info=$(file assets/concepts/goregrind-dissection-club.webp)
          echo "DISSECTION :: $bytes bytes :: $info"
          echo "$info" | grep -q 'Web/P image'
          echo "$info" | grep -q '650x812'
      - name: Route cards to recovered assets and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#goregrind-canine-pathology.webp?v=direct1#goregrind-canine-pathology.avif?v=hires3#g" approved-mockups.js
          sed -i "s#goregrind-dissection-club.webp?v=direct1#goregrind-dissection-club.webp?v=hires3#g" approved-mockups.js
          rm -rf assets/hires-payload
          rm -f .github/workflows/qa-recovered-concepts.yml
          rm -f .github/workflows/assemble-recovered-goregrind.yml
      - name: Commit verified recovered review boards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install validated high-resolution review assets"
          git push
