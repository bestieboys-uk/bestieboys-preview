name: Assemble recovered Goregrind boards
on:
  push:
    branches:
      - fix/highres-review-assets-20260827
    paths:
      - '.github/workflows/assemble-recovered-goregrind.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and validate recovered AVIF boards
        shell: bash
        run: |
          set -euo pipefail
          for name in goregrind-canine-pathology.avif goregrind-dissection-club.avif; do
            stem="assets/hires-payload/$name"
            target="assets/concepts/$name"
            cat "${stem}.part"* | base64 -d > "$target"
            test -s "$target"
            bytes=$(stat -c%s "$target")
            test "$bytes" -gt 10000
            info=$(file "$target")
            echo "=== $target :: $bytes bytes :: $info ==="
            echo "$info" | grep -q 'AVIF Image'
          done
      - name: Route Goregrind cards to recovered AVIFs
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#goregrind-canine-pathology.webp?v=direct1#goregrind-canine-pathology.avif?v=hires3#g" approved-mockups.js
          sed -i "s#goregrind-dissection-club.webp?v=direct1#goregrind-dissection-club.avif?v=hires3#g" approved-mockups.js
          rm -rf assets/hires-payload
          rm -f .github/workflows/qa-recovered-concepts.yml
          rm -f .github/workflows/assemble-recovered-goregrind.yml
      - name: Commit verified recovered boards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install recovered Goregrind AVIF review boards"
          git push
