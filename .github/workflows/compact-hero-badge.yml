name: Compact hero badge

on:
  push:
    branches: [main]
    paths: [.github/workflows/compact-hero-badge.yml]

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact Tour Issue caption
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<div class="badge">GERRARD / DEVELOPMENT 001 / TOUR ISSUE</div>','<div class="badge">GERRARD / TOUR ISSUE</div>')
          s=re.sub(r'theme-lab\.css\?v=\d+','theme-lab.css?v=7',s)
          p.write_text(s)
          c=Path('theme-lab.css')
          css=c.read_text()
          if '/* Compact Tour Issue caption */' not in css:
              css += '''\n\n/* Compact Tour Issue caption */\nbody .badge{width:auto!important;max-width:55%!important;white-space:normal!important;line-height:1.15!important;text-align:left!important}\n@media(max-width:620px){body .badge{max-width:58%!important;font-size:.48rem!important;padding:7px 9px!important}}\n'''
              c.write_text(css)
      - name: Commit compact badge
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html theme-lab.css
          git commit -m "Compact Tour Issue hero caption"
          git push
