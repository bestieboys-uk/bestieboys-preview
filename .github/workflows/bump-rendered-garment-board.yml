name: Bump rendered garment board
on:
  push:
    paths:
      - '.github/workflows/bump-rendered-garment-board.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump top-level theme script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('theme-lab.js?v=referencebatch1','theme-lab.js?v=renderedboard1')
          p.write_text(s)
          Path('.github/workflows/bump-rendered-garment-board.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load rendered garment board presentation"
          git push
