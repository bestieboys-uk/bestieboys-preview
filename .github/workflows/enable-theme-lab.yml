name: Enable preview design lab

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-theme-lab.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire theme lab
        run: python .github/scripts/enable_theme_lab.py
      - name: Commit theme lab wiring
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable premium theme lab and garment mockups"
          git push
