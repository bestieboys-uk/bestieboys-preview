name: Finalize Black Metal preview reuse

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-black-metal-preview.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust concept-art cache and clean temporary files
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="img.src=slot.dataset.artBase+exts[i];"
          new="img.src=slot.dataset.artBase+exts[i]+'?v=earlybm1';"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
      - name: Remove one-time import files
        run: |
          rm -rf .tmp
          rm -f _bm-assets-note.txt
          rm -f assets/concepts/black-metal-frostbite-portrait.txt
          rm -f .github/workflows/install-existing-black-metal.yml
          rm -f .github/workflows/install-existing-black-metal-v2.yml
          rm -f .github/workflows/cleanup-black-metal-import.yml
          rm -f .github/workflows/compact-hero-badge.yml
          rm -f .github/workflows/finalize-black-metal-preview.yml
      - name: Commit final Black Metal preview state
        run: |
          git config user.name "bestieboys-uk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize reused Black Metal preview boards"
          git push
