name: Load garment storefront v3
on:
  push:
    paths:
      - '.github/workflows/load-garment-storefront-v3.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire garment v3 and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="garment-storefront-v3.css?v=1">'
          js='<script src="garment-storefront-v3.js?v=1"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s)
          PY
          rm -f .github/workflows/load-garment-storefront-v3.yml
      - name: Commit garment storefront
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/load-garment-storefront-v3.yml
          git commit -m 'Load full-garment storefront presentation v3'
          git push
