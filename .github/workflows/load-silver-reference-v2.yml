name: Load Silver Noise reference v2
on:
  push:
    paths:
      - '.github/workflows/load-silver-reference-v2.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load corrected Silver Noise layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="silver-reference-v1.css?v=1">'
          new=old+'\n<link rel="stylesheet" href="silver-reference-v2.css?v=1">'
          if 'silver-reference-v2.css' not in s:
              if old not in s:
                  raise SystemExit('silver v1 link missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/load-silver-reference-v2.yml').unlink()
          PY
      - name: Commit Silver Noise v2 loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load corrected Silver Noise reference layer"
          git push
