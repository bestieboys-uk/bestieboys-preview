name: Wire reference batch
on:
  push:
    paths:
      - '.github/workflows/wire-reference-batch.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index references
        run: python .tmp/wire-reference-batch.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load reference theme batch assets"
          git push
