name: Bump Grindcore mockups
on:
  push:
    branches:
      - fix/grindcore-mockups
    paths:
      - '.github/workflows/bump-grindcore-mockups.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh Grindcore mockup renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='theme-lab.js?v=approved3'
          new='theme-lab.js?v=grind1'
          if old not in s:
              raise SystemExit('theme-lab approved3 marker not found')
          p.write_text(s.replace(old,new))
          Path('.github/workflows/bump-grindcore-mockups.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load Grindcore mockups on preview"
          git push
