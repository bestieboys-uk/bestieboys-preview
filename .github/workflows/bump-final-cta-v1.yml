name: Bump final CTA v1
on:
  push:
    paths:
      - '.github/workflows/bump-final-cta-v1.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump nested storefront assets and self-clean
        run: |
          sed -i 's/storefront-pass-v1.css?v=1/storefront-pass-v1.css?v=2/g' archive-target.js
          sed -i 's/storefront-pass-v1.js?v=2/storefront-pass-v1.js?v=3/g' archive-target.js
          sed -i 's/archive-target.js?v=6/archive-target.js?v=7/g' theme-lab.js
          rm .github/workflows/bump-final-cta-v1.yml
      - name: Commit final CTA refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-target.js theme-lab.js .github/workflows/bump-final-cta-v1.yml
          git commit -m 'Load final storefront CTA pass'
          git push
